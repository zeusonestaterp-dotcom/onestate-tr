<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONESTATE TR | Ceza Kuralları</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#07090f;
    --panel:#10131c;
    --panel2:#151925;
    --border:rgba(255,255,255,.08);
    --text:#f5f7ff;
    --muted:#8991a5;
    --blue:#5865f2;
    --blue2:#7289da;
    --red:#ff4d67;
    --orange:#ffad42;
    --green:#42d392;
    --purple:#a970ff;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(88,101,242,.18),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(169,112,255,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

header{
    position:relative;
    overflow:hidden;
    padding:65px 20px 55px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:rgba(10,12,20,.7);
    backdrop-filter:blur(20px);
}

header::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:var(--blue);
    filter:blur(180px);
    opacity:.12;
    left:-200px;
    top:-250px;
}

.logo{
    position:relative;
    width:80px;
    height:80px;
    margin:auto;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--blue),#8c52ff);
    box-shadow:
        0 0 40px rgba(88,101,242,.35),
        inset 0 0 25px rgba(255,255,255,.15);
    font-size:38px;
    font-weight:900;
}

header h1{
    position:relative;
    margin-top:22px;
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
}

header h1 span{
    color:var(--blue2);
}

header p{
    position:relative;
    color:var(--muted);
    margin-top:12px;
    font-size:15px;
}

/* CONTAINER */

.container{
    max-width:1450px;
    margin:auto;
    padding:30px 18px 70px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.02)
    );
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(15px);
    transition:.25s;
}

.stat:hover{
    transform:translateY(-4px);
    border-color:rgba(88,101,242,.4);
}

.stat-title{
    color:var(--muted);
    font-size:13px;
}

.stat-number{
    margin-top:8px;
    font-size:28px;
    font-weight:900;
}

/* SEARCH */

.search-box{
    position:relative;
    margin-bottom:25px;
}

.search{
    width:100%;
    height:58px;
    padding:0 20px 0 55px;
    border-radius:16px;
    border:1px solid var(--border);
    outline:none;
    background:rgba(16,19,28,.9);
    color:white;
    font-size:16px;
    transition:.25s;
}

.search:focus{
    border-color:var(--blue);
    box-shadow:0 0 25px rgba(88,101,242,.15);
}

.search-icon{
    position:absolute;
    left:20px;
    top:17px;
    color:var(--muted);
    font-size:20px;
}

/* FILTER */

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.filter{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    padding:10px 17px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.filter:hover,
.filter.active{
    background:var(--blue);
    color:white;
    border-color:var(--blue);
}

/* SECTION */

.section{
    margin-bottom:40px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:800;
}

.section-title .icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(88,101,242,.14);
    border:1px solid rgba(88,101,242,.25);
}

.section-count{
    color:var(--muted);
    font-size:13px;
}

/* TABLE */

.table-container{
    overflow:hidden;
    border-radius:18px;
    border:1px solid var(--border);
    background:rgba(13,16,24,.85);
    box-shadow:0 15px 50px rgba(0,0,0,.2);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:rgba(255,255,255,.035);
}

th{
    padding:16px;
    text-align:left;
    color:#aeb6ca;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

td{
    padding:15px 16px;
    border-top:1px solid rgba(255,255,255,.045);
    font-size:14px;
}

tbody tr{
    transition:.2s;
}

tbody tr:hover{
    background:rgba(88,101,242,.055);
}

/* CODE */

.code{
    color:#8290ff;
    font-weight:900;
    white-space:nowrap;
}

/* PUNISHMENT */

.punishment{
    font-weight:800;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:7px 11px;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
}

.jail{
    background:rgba(255,173,66,.1);
    color:var(--orange);
    border:1px solid rgba(255,173,66,.18);
}

.mute{
    background:rgba(169,112,255,.1);
    color:var(--purple);
    border:1px solid rgba(169,112,255,.18);
}

.ban{
    background:rgba(255,77,103,.1);
    color:var(--red);
    border:1px solid rgba(255,77,103,.18);
}

.kick{
    background:rgba(66,211,146,.1);
    color:var(--green);
    border:1px solid rgba(66,211,146,.18);
}

.device{
    background:rgba(255,77,103,.1);
    color:#ff6f85;
    border:1px solid rgba(255,77,103,.2);
}

.note{
    color:var(--muted);
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:35px 20px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:13px;
}

footer strong{
    color:var(--blue2);
}

/* MOBILE */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    header h1{
        font-size:32px;
    }

}

@media(max-width:650px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .table-container{
        overflow-x:auto;
    }

    table{
        min-width:1000px;
    }

    header{
        padding:45px 15px;
    }

}

</style>
