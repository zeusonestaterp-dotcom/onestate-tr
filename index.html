<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#080a12;
color:#fff;
min-height:100vh;
}

header{
padding:45px 20px 35px;
text-align:center;
background:
radial-gradient(circle at 50% 0%,#3738a8 0%,transparent 45%),
linear-gradient(180deg,#11142b,#080a12);
border-bottom:1px solid #20243a;
}

.logo{
width:80px;
height:80px;
margin:auto;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:900;
background:linear-gradient(135deg,#5865f2,#8b5cf6);
box-shadow:0 0 35px #5865f255;
}

h1{
margin-top:20px;
font-size:32px;
letter-spacing:3px;
}

h1 span{color:#6574ff}

.subtitle{
margin-top:10px;
color:#8d93aa;
font-size:14px;
}

.container{
max-width:1250px;
margin:auto;
padding:25px 16px 60px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:20px;
}

.stat{
background:linear-gradient(145deg,#111522,#0d1019);
border:1px solid #24283b;
border-radius:20px;
padding:20px;
}

.stat-title{
color:#858ca3;
font-size:13px;
}

.stat-value{
font-size:28px;
font-weight:800;
margin-top:8px;
}

.search{
width:100%;
padding:17px 20px;
border-radius:16px;
border:1px solid #292e44;
background:#111520;
color:white;
font-size:15px;
outline:none;
margin-bottom:16px;
}

.search:focus{
border-color:#6574ff;
box-shadow:0 0 0 3px #6574ff18;
}

.filters{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:22px;
}

button{
border:1px solid #292e44;
background:#111520;
color:#aab0c4;
padding:11px 16px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

button:hover,
button.active{
background:#5865f2;
color:#fff;
border-color:#5865f2;
}

.section{
margin-top:30px;
}

.section-title{
display:flex;
align-items:center;
gap:10px;
margin-bottom:14px;
font-size:21px;
}

.badge{
font-size:11px;
padding:5px 9px;
border-radius:8px;
background:#1d2240;
color:#8490ff;
}

.rules{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.rule{
background:linear-gradient(145deg,#10131d,#0c0f17);
border:1px solid #24283a;
border-radius:17px;
padding:17px;
transition:.2s;
}

.rule:hover{
transform:translateY(-2px);
border-color:#5865f255;
}

.rule-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px;
}

.code{
font-weight:900;
font-size:17px;
color:#8b95ff;
}

.type{
font-size:11px;
font-weight:800;
padding:6px 9px;
border-radius:8px;
background:#1c2030;
color:#aab0c4;
}

.name{
font-size:16px;
font-weight:800;
margin-bottom:5px;
}

.tr{
font-size:14px;
color:#9da4b8;
margin-bottom:13px;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.info-box{
background:#0a0d14;
border:1px solid #1e2332;
border-radius:10px;
padding:10px;
}

.label{
font-size:10px;
color:#70778c;
text-transform:uppercase;
margin-bottom:4px;
}

.value{
font-size:13px;
font-weight:700;
}

.explanation{
margin-top:10px;
padding:10px;
border-radius:10px;
background:#111625;
color:#8f97aa;
font-size:12px;
line-height:1.5;
}

.no-result{
text-align:center;
padding:45px 15px;
color:#747b91;
display:none;
}

footer{
text-align:center;
padding:30px;
border-top:1px solid #20243a;
color:#62697d;
font-size:12px;
}

@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr)}
.rules{grid-template-columns:1fr}
h1{font-size:27px}
}

@media(max-width:450px){
.container{padding:18px 11px 45px}
.stat{padding:15px}
.stat-value{font-size:23px}
.info{grid-template-columns:1fr}
}
</style>
</head>
